<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>刷词机本地数据救援工具</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #141821;
    }
    body { margin: 0; padding: 20px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    p { line-height: 1.65; margin: 8px 0; }
    .danger { color: #b42318; font-weight: 700; }
    .ok { color: #057a55; font-weight: 700; }
    .warn { color: #b54708; font-weight: 700; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 8px 8px 8px 0;
      font-weight: 700;
      cursor: pointer;
      background: #0f766e;
      color: #fff;
      font-size: 15px;
    }
    button.secondary { background: #334155; }
    button.danger-btn { background: #b42318; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #0b1020;
      color: #e5e7eb;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    textarea { min-height: 260px; resize: vertical; }
    .small { color: #64748b; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .pill { background: #f1f5f9; border-radius: 999px; padding: 7px 10px; display: inline-block; margin: 3px; font-size: 13px; }
    .big-status { font-size: 18px; padding: 10px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>刷词机本地数据救援工具</h1>
    <p class="danger">重要：这个页面只读取本机浏览器数据，不连接 GitHub，不上传，不覆盖，不清理。不要点击浏览器“清理网站数据/垃圾桶”。</p>
    <p>请用仍显示“已存储数据”的同一个浏览器打开本页面，地址应类似：<strong>https://user23604.github.io/shua_ci_ji/rescue.html</strong></p>
    <p class="small">如果把这个文件直接从本地文件管理器打开，地址会是 file://，那就读不到网站数据。必须部署到同一个 GitHub Pages 域名下再打开。</p>
  </div>

  <div class="card">
    <h2>操作</h2>
    <button id="scanBtn">生成诊断并读取本机数据</button>
    <button id="downloadBtn" class="secondary" disabled>下载完整备份 JSON</button>
    <button id="copyBtn" class="secondary" disabled>复制诊断摘要</button>
    <p id="status" class="big-status warn">尚未开始。</p>
  </div>

  <div class="card">
    <h2>快速判断</h2>
    <div id="quick" class="grid"></div>
  </div>

  <div class="card">
    <h2>诊断摘要</h2>
    <textarea id="summary" readonly placeholder="点击“生成诊断并读取本机数据”后，这里会显示摘要。"></textarea>
  </div>

  <div class="card">
    <h2>发现的关键片段</h2>
    <pre id="snippets">暂无。</pre>
  </div>
</div>

<script>
(() => {
  "use strict";

  const TARGET_DATES = ["2026-06-18", "2026-06-19", "2026-06-15", "2026-06-11", "2026-06-10"];
  const VOCAB_KEYS = [
    "vocab_machine_settings_v1",
    "vocab_machine_cloud_v1",
    "vocab_machine_sync_meta_v1",
    "vocab_machine_pending_ops_v1"
  ];

  let lastBundle = null;
  let lastSummaryText = "";

  const $ = (id) => document.getElementById(id);

  function safeJsonParse(value) {
    if (typeof value !== "string") return null;
    try { return JSON.parse(value); } catch (_) { return null; }
  }

  function byteSize(str) {
    try { return new Blob([String(str)]).size; } catch (_) { return String(str || "").length; }
  }

  function cloneSimple(value) {
    try { return JSON.parse(JSON.stringify(value)); } catch (_) { return value; }
  }

  function isLikelySyncPayload(obj) {
    return !!(
      obj && typeof obj === "object" &&
      (obj.version === 1 || obj.progress || obj.marks || obj.activity || obj.unitStats) &&
      (obj.settings || obj.progress || obj.activity)
    );
  }

  function summarizePayload(payload) {
    if (!payload || typeof payload !== "object") return null;
    const activityDates = [];
    const progress = {};
    const markCounts = {};

    if (payload.progress && typeof payload.progress === "object") {
      Object.entries(payload.progress).forEach(([bookId, p]) => {
        progress[bookId] = {
          unit: p && p.unit,
          lastWordId: p && p.lastWordId,
          updatedAt: p && p.updatedAt
        };
      });
    }

    if (payload.activity && typeof payload.activity === "object") {
      Object.entries(payload.activity).forEach(([bookId, book]) => {
        const days = book && book.days && typeof book.days === "object" ? book.days : {};
        Object.keys(days).forEach((date) => activityDates.push(`${bookId}:${date}`));
      });
    }

    if (payload.marks && typeof payload.marks === "object") {
      Object.entries(payload.marks).forEach(([bookId, marks]) => {
        markCounts[bookId] = {
          known: Array.isArray(marks && marks.known) ? marks.known.length : 0,
          unknown: Array.isArray(marks && marks.unknown) ? marks.unknown.length : 0
        };
      });
    }

    return {
      version: payload.version,
      updatedAt: payload.updatedAt,
      activeBookId: payload.activeBookId,
      settingsBookId: payload.settings && payload.settings.bookId,
      settingsUnit: payload.settings && payload.settings.unit,
      progress,
      activityDates: activityDates.sort(),
      markCounts
    };
  }

  function findSnippets(text, needles) {
    const out = [];
    const lower = text.toLowerCase();
    needles.forEach((needle) => {
      const idx = lower.indexOf(String(needle).toLowerCase());
      if (idx >= 0) {
        const start = Math.max(0, idx - 260);
        const end = Math.min(text.length, idx + String(needle).length + 360);
        out.push(`--- 命中：${needle} ---\n${text.slice(start, end)}`);
      }
    });
    return out;
  }

  function collectLocalStorage() {
    const result = { supported: true, totalBytes: 0, keys: [], items: {}, parsed: {} };
    try {
      for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        result.keys.push(key);
        result.items[key] = value;
        result.totalBytes += byteSize(key) + byteSize(value || "");
        const parsed = safeJsonParse(value);
        if (parsed !== null) result.parsed[key] = parsed;
      }
      result.keys.sort();
    } catch (error) {
      result.supported = false;
      result.error = error && error.message || String(error);
    }
    return result;
  }

  function collectSessionStorage() {
    const result = { supported: true, totalBytes: 0, keys: [], items: {} };
    try {
      for (let i = 0; i < sessionStorage.length; i += 1) {
        const key = sessionStorage.key(i);
        const value = sessionStorage.getItem(key);
        result.keys.push(key);
        result.items[key] = value;
        result.totalBytes += byteSize(key) + byteSize(value || "");
      }
      result.keys.sort();
    } catch (error) {
      result.supported = false;
      result.error = error && error.message || String(error);
    }
    return result;
  }

  function requestToPlain(req) {
    return {
      url: req.url,
      method: req.method,
      mode: req.mode,
      credentials: req.credentials,
      cache: req.cache,
      destination: req.destination,
      referrer: req.referrer
    };
  }

  async function responseToPlain(response) {
    const headers = {};
    try { response.headers.forEach((v, k) => { headers[k] = v; }); } catch (_) {}
    const contentType = headers["content-type"] || "";
    const item = {
      status: response.status,
      statusText: response.statusText,
      type: response.type,
      url: response.url,
      headers,
      contentType,
      bodyText: null,
      bodyError: null
    };
    try {
      const text = await response.clone().text();
      item.bodyText = text;
      item.bodyBytes = byteSize(text);
    } catch (error) {
      item.bodyError = error && error.message || String(error);
    }
    return item;
  }

  async function collectCaches() {
    const result = { supported: "caches" in window, caches: [] };
    if (!result.supported) return result;
    try {
      const names = await caches.keys();
      for (const name of names) {
        const cache = await caches.open(name);
        const requests = await cache.keys();
        const entries = [];
        for (const request of requests) {
          const response = await cache.match(request);
          entries.push({
            request: requestToPlain(request),
            response: response ? await responseToPlain(response) : null
          });
        }
        result.caches.push({ name, entries });
      }
    } catch (error) {
      result.error = error && error.message || String(error);
    }
    return result;
  }

  function idbRequest(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("IndexedDB request failed"));
    });
  }

  function openIndexedDb(name) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(name);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error(`open ${name} failed`));
      req.onblocked = () => reject(new Error(`open ${name} blocked`));
      req.onupgradeneeded = () => {
        try { req.transaction.abort(); } catch (_) {}
        reject(new Error(`open ${name} would create/upgrade database, aborted for safety`));
      };
    });
  }

  async function readObjectStore(db, storeName) {
    const storeDump = { name: storeName, count: null, records: [], error: null };
    try {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      try { storeDump.count = await idbRequest(store.count()); } catch (_) {}
      if (typeof store.getAll === "function") {
        const values = await idbRequest(store.getAll());
        let keys = [];
        try { keys = await idbRequest(store.getAllKeys()); } catch (_) {}
        storeDump.records = values.map((value, index) => ({ key: keys[index], value: cloneSimple(value) }));
      } else {
        await new Promise((resolve, reject) => {
          const cursorReq = store.openCursor();
          cursorReq.onsuccess = () => {
            const cursor = cursorReq.result;
            if (!cursor) return resolve();
            storeDump.records.push({ key: cloneSimple(cursor.key), value: cloneSimple(cursor.value) });
            cursor.continue();
          };
          cursorReq.onerror = () => reject(cursorReq.error || new Error("cursor failed"));
        });
      }
    } catch (error) {
      storeDump.error = error && error.message || String(error);
    }
    return storeDump;
  }

  async function collectIndexedDB() {
    const result = { supported: "indexedDB" in window, hasDatabasesApi: false, databases: [] };
    if (!result.supported) return result;
    if (typeof indexedDB.databases !== "function") {
      result.error = "当前浏览器不支持 indexedDB.databases()，无法自动枚举数据库名。";
      return result;
    }
    result.hasDatabasesApi = true;
    try {
      const dbs = await indexedDB.databases();
      for (const info of dbs) {
        if (!info || !info.name) continue;
        const dbDump = { name: info.name, version: info.version, objectStores: [], error: null };
        let db = null;
        try {
          db = await openIndexedDb(info.name);
          dbDump.version = db.version;
          const storeNames = Array.from(db.objectStoreNames || []);
          for (const storeName of storeNames) {
            dbDump.objectStores.push(await readObjectStore(db, storeName));
          }
        } catch (error) {
          dbDump.error = error && error.message || String(error);
        } finally {
          try { if (db) db.close(); } catch (_) {}
        }
        result.databases.push(dbDump);
      }
    } catch (error) {
      result.error = error && error.message || String(error);
    }
    return result;
  }

  function analyzeBundle(bundle) {
    const jsonText = JSON.stringify(bundle);
    const foundDates = TARGET_DATES.filter((date) => jsonText.includes(date));
    const allDates = Array.from(new Set(jsonText.match(/20\d{2}-\d{2}-\d{2}/g) || [])).sort();
    const vocabKeysFound = Object.keys(bundle.localStorage.items || {}).filter((key) => key.includes("vocab") || key.includes("sync") || key.includes("progress") || key.includes("activity") || key.includes("marks"));

    const likelyPayloads = [];
    Object.entries(bundle.localStorage.parsed || {}).forEach(([key, value]) => {
      if (isLikelySyncPayload(value)) likelyPayloads.push({ source: `localStorage:${key}`, summary: summarizePayload(value) });
      if (value && typeof value === "object") {
        Object.entries(value).forEach(([subKey, subValue]) => {
          if (isLikelySyncPayload(subValue)) likelyPayloads.push({ source: `localStorage:${key}.${subKey}`, summary: summarizePayload(subValue) });
        });
      }
    });

    const snippets = findSnippets(jsonText, ["2026-06-18", "vocab_machine", "pending_ops", "activity", "lastWordId", "wordIds"]);

    return {
      foundTargetDates: foundDates,
      allDates,
      hasJune18: foundDates.includes("2026-06-18"),
      localStorageKeyCount: bundle.localStorage.keys ? bundle.localStorage.keys.length : 0,
      localStorageTotalBytes: bundle.localStorage.totalBytes || 0,
      vocabLikeLocalStorageKeys: vocabKeysFound,
      indexedDbCount: bundle.indexedDB.databases ? bundle.indexedDB.databases.length : 0,
      cacheCount: bundle.cacheStorage.caches ? bundle.cacheStorage.caches.length : 0,
      likelyPayloads,
      snippets
    };
  }

  function renderQuick(analysis) {
    const items = [];
    items.push(`<div class="pill ${analysis.hasJune18 ? "ok" : "danger"}">2026-06-18：${analysis.hasJune18 ? "发现" : "未发现"}</div>`);
    items.push(`<div class="pill">localStorage：${analysis.localStorageKeyCount} 个 key，约 ${analysis.localStorageTotalBytes} bytes</div>`);
    items.push(`<div class="pill">IndexedDB：${analysis.indexedDbCount} 个库</div>`);
    items.push(`<div class="pill">Cache Storage：${analysis.cacheCount} 个缓存</div>`);
    items.push(`<div class="pill">发现日期：${analysis.allDates.slice(-8).join("、") || "无"}</div>`);
    $("quick").innerHTML = items.join("\n");
  }

  function buildSummary(bundle, analysis) {
    const lines = [];
    lines.push("刷词机本地数据救援诊断摘要");
    lines.push("================================");
    lines.push(`生成时间：${bundle.meta.generatedAt}`);
    lines.push(`页面地址：${bundle.meta.href}`);
    lines.push(`Origin：${bundle.meta.origin}`);
    lines.push(`User Agent：${bundle.meta.userAgent}`);
    lines.push("");
    lines.push(`是否发现 2026-06-18：${analysis.hasJune18 ? "是" : "否"}`);
    lines.push(`命中的目标日期：${analysis.foundTargetDates.join(", ") || "无"}`);
    lines.push(`所有日期：${analysis.allDates.join(", ") || "无"}`);
    lines.push("");
    lines.push(`localStorage key 数：${analysis.localStorageKeyCount}`);
    lines.push(`localStorage 大小估计：${analysis.localStorageTotalBytes} bytes`);
    lines.push(`localStorage 相关 key：${analysis.vocabLikeLocalStorageKeys.join(", ") || "无"}`);
    VOCAB_KEYS.forEach((key) => {
      lines.push(`- ${key}: ${Object.prototype.hasOwnProperty.call(bundle.localStorage.items || {}, key) ? "存在" : "不存在"}`);
    });
    lines.push("");
    lines.push(`IndexedDB 数据库数：${analysis.indexedDbCount}`);
    (bundle.indexedDB.databases || []).forEach((db) => {
      lines.push(`- DB ${db.name} v${db.version}: ${db.objectStores ? db.objectStores.length : 0} stores ${db.error ? "ERROR: " + db.error : ""}`);
      (db.objectStores || []).forEach((store) => {
        lines.push(`  · ${store.name}: count=${store.count}, exported=${store.records ? store.records.length : 0} ${store.error ? "ERROR: " + store.error : ""}`);
      });
    });
    if (bundle.indexedDB.error) lines.push(`IndexedDB 错误：${bundle.indexedDB.error}`);
    lines.push("");
    lines.push(`Cache Storage 缓存数：${analysis.cacheCount}`);
    (bundle.cacheStorage.caches || []).forEach((cache) => {
      lines.push(`- Cache ${cache.name}: ${cache.entries ? cache.entries.length : 0} entries`);
    });
    if (bundle.cacheStorage.error) lines.push(`Cache 错误：${bundle.cacheStorage.error}`);
    lines.push("");
    lines.push("疑似同步 payload：");
    if (!analysis.likelyPayloads.length) {
      lines.push("无");
    } else {
      analysis.likelyPayloads.forEach((item) => {
        lines.push(`- ${item.source}`);
        lines.push(JSON.stringify(item.summary, null, 2));
      });
    }
    return lines.join("\n");
  }

  async function runScan() {
    $("scanBtn").disabled = true;
    $("downloadBtn").disabled = true;
    $("copyBtn").disabled = true;
    $("status").textContent = "正在读取本机存储，请不要关闭页面……";
    $("status").className = "big-status warn";
    $("summary").value = "读取中……";
    $("snippets").textContent = "读取中……";

    const bundle = {
      meta: {
        generatedAt: new Date().toISOString(),
        href: location.href,
        origin: location.origin,
        pathname: location.pathname,
        userAgent: navigator.userAgent,
        language: navigator.language
      },
      localStorage: collectLocalStorage(),
      sessionStorage: collectSessionStorage(),
      indexedDB: await collectIndexedDB(),
      cacheStorage: await collectCaches()
    };

    const analysis = analyzeBundle(bundle);
    bundle.analysis = analysis;
    lastBundle = bundle;
    lastSummaryText = buildSummary(bundle, analysis);

    renderQuick(analysis);
    $("summary").value = lastSummaryText;
    $("snippets").textContent = analysis.snippets.length ? analysis.snippets.join("\n\n") : "没有发现关键片段。";

    if (analysis.hasJune18) {
      $("status").textContent = "发现 2026-06-18 痕迹！请立刻下载完整备份 JSON。";
      $("status").className = "big-status ok";
    } else {
      $("status").textContent = "未发现 2026-06-18 字样，但仍建议下载完整备份 JSON 保存。";
      $("status").className = "big-status danger";
    }

    $("scanBtn").disabled = false;
    $("downloadBtn").disabled = false;
    $("copyBtn").disabled = false;
  }

  function downloadBackup() {
    if (!lastBundle) return;
    const json = JSON.stringify(lastBundle, null, 2);
    const blob = new Blob([json], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    const a = document.createElement("a");
    a.href = url;
    a.download = `shua-ci-ji-local-rescue-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 1000);
  }

  async function copySummary() {
    if (!lastSummaryText) return;
    try {
      await navigator.clipboard.writeText(lastSummaryText);
      $("status").textContent = "诊断摘要已复制。完整数据请仍然下载 JSON 备份。";
    } catch (error) {
      $("status").textContent = "复制失败，请手动长按摘要文本复制。";
    }
  }

  $("scanBtn").addEventListener("click", runScan);
  $("downloadBtn").addEventListener("click", downloadBackup);
  $("copyBtn").addEventListener("click", copySummary);
})();
</script>
</body>
</html>
